<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#cfe3fb;--bg2:#fde3ee;--card:#ffffffcc;--ink:#2f4a73;--soft:#6f86a8;--blue:#6fa8ee;--blue2:#dcebff;--pink:#f59cc0;--pink2:#ffe1ee;--line:#ffffffaa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(170deg,var(--bg1),var(--bg2));overflow:hidden}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:500}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:auto;position:relative}
#stars{position:fixed;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(#fff 1.2px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.3px);background-size:90px 90px,140px 140px;background-position:10px 20px,60px 70px}
main{flex:1;overflow:auto;padding:14px 14px 20px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.top h1{font-size:20px;margin:0}
.chip{background:var(--card);border-radius:20px;padding:4px 10px;font-size:12px;border:1px solid var(--line);cursor:pointer}
nav{display:flex;background:var(--card);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px 8px}
nav button{flex:1;background:none;border:0;color:var(--soft);font:600 11px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:14px}
nav button span{font-size:20px}nav button.on{color:var(--ink);background:var(--blue2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #6fa8ee22}
.row{display:flex;gap:10px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font:600 54px Fredoka,sans-serif;color:var(--blue);line-height:1}
.btn{border:0;border-radius:18px;padding:11px 16px;font:500 15px Fredoka,sans-serif;color:#fff;background:var(--blue);width:100%;cursor:pointer}
.btn.pk{background:var(--pink)}.btn.sm{width:auto;padding:7px 12px;font-size:13px}
.tile{background:var(--blue2);border-radius:18px;padding:12px;text-align:center;border:0;color:var(--ink);font:500 14px Fredoka,sans-serif;cursor:pointer}
.tile.pk{background:var(--pink2)}.tile span{display:block;font-size:26px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:16px;padding:9px;background:var(--pink2);color:var(--ink);font:500 14px Fredoka;cursor:pointer}.tabs button.on{background:var(--blue);color:#fff}
.muted{color:var(--soft);font-size:13px}.empty{text-align:center;color:var(--soft);padding:24px 10px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);cursor:pointer}.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.ph div{padding:6px 8px;font-size:12px}.ph b{display:block;font-family:Fredoka;font-weight:500}
.msgs{display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 13px;border-radius:18px;font-size:15px;white-space:pre-wrap;word-break:break-word}.b small{display:block;font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.me{align-self:flex-end;background:var(--pink2);border-bottom-right-radius:6px}.you{align-self:flex-start;background:var(--blue2);border-bottom-left-radius:6px}
.ping{align-self:center;background:var(--card);border-radius:20px;padding:6px 14px;font-size:13px}
.compose{display:flex;gap:8px;padding:8px 12px;background:var(--card)}
input,textarea,select{width:100%;border:1px solid var(--line);background:#ffffffaa;color:#2f4a73;border-radius:14px;padding:10px 12px;font:15px Nunito,sans-serif}
textarea{min-height:120px;resize:vertical}label{font-size:13px;color:var(--soft);display:block;margin:8px 0 4px}
.sheet{position:fixed;inset:0;background:#1a2a4a66;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.show{display:flex}
.sheet>div{background:var(--bg1);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px;max-height:88%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.letter{background:#fffdf7;color:#5a4a50;border-radius:16px;padding:14px;font-size:15px;line-height:1.6;white-space:pre-wrap;border:1px dashed var(--pink)}
.rp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rp button{border:1px solid var(--pink);background:#fff;color:#7a4560;border-radius:14px;padding:6px 10px;font:600 12px Nunito;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.item input{width:22px;height:22px}.done{text-decoration:line-through;opacity:.55}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-90px);background:var(--pink);color:#fff;padding:10px 18px;border-radius:20px;font:500 15px Fredoka;transition:.4s;z-index:50;max-width:90%;text-align:center}#toast.show{transform:translateX(-50%) translateY(0)}
.hrt{position:fixed;bottom:80px;font-size:26px;animation:up 2s forwards;pointer-events:none;z-index:40}@keyframes up{to{transform:translateY(-320px);opacity:0}}
.float{animation:fl 3.5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.float,.hrt{animation:none}}
.who{position:fixed;inset:0;z-index:60;background:linear-gradient(170deg,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.who h1{font-size:34px;margin:0}.who .btn{max-width:300px}
.tw{animation:tw 2s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.rn{animation:rn .9s linear infinite}@keyframes rn{to{transform:translateY(40px);opacity:0}}
.rs{animation:rs 3s ease-in infinite}@keyframes rs{to{transform:translate(-120px,60px);opacity:0}}
.fl2{animation:fl2 3s ease-in infinite}@keyframes fl2{to{transform:translateY(-70px);opacity:0}}
.fk{animation:fk 1s ease-in-out infinite alternate}@keyframes fk{to{transform:scale(1.15,.9)}}
.scene{width:100%;border-radius:20px;display:block}.hat{position:absolute;top:-8px;left:50%;transform:translateX(-50%)}
.pill{display:inline-block;background:var(--blue2);border-radius:12px;padding:2px 8px;font-size:12px}
@media (prefers-reduced-motion:reduce){.tw,.rn,.rs,.fl2,.fk{animation:none}}
.call{position:fixed;inset:0;z-index:80;background:linear-gradient(170deg,var(--bg1),var(--bg2));display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}.call .btn{max-width:300px}
.shake{animation:sh .5s infinite}@keyframes sh{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.cf{position:fixed;top:-20px;z-index:90;border-radius:2px;animation:cf 3s linear forwards;pointer-events:none}@keyframes cf{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
</style></head><body>
<div id="stars"></div>
<div id="app">
 <div class="top"><h1>Our Little Universe 💞</h1><span class="chip" id="me"></span></div>
 <main id="main"></main>
 <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div id="sheetIn"></div></div>
<div id="toast"></div>
<div id="call" class="call"></div>
<div class="who" id="who" style="display:none"><div id="whoBears"></div><h1>Our Little Universe</h1><p class="muted">Different stars, same universe ♡<br>Kamu siapa?</p>
<button class="btn" onclick="setWho('Amell')">Aku Amell 💙</button><button class="btn pk" onclick="setWho('Yakii')">Aku Yakii 🩷</button></div>
<script>
const START=new Date(2024,10,26),NAMES=['Amell','Yakii'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let who=ls.get('olu_who'),page='home',D={chat:[],photos:[],letters:[],wish:[],songs:[],shows:[],coupons:[],capsules:[],answers:[],profile:[],meet:[],games:[],calls:[],meta:[],wishes:[]},dbm=null;
const other=()=>NAMES.find(n=>n!==who);
const fmt=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function bear(c,c2,s=110){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="24" cy="24" r="14" fill="${c}"/><circle cx="76" cy="24" r="14" fill="${c}"/><circle cx="24" cy="24" r="7" fill="${c2}"/><circle cx="76" cy="24" r="7" fill="${c2}"/><ellipse cx="50" cy="58" rx="38" ry="34" fill="${c}"/><ellipse cx="50" cy="66" rx="16" ry="11" fill="#fff"/><circle cx="36" cy="54" r="4.5" fill="#35466b"/><circle cx="64" cy="54" r="4.5" fill="#35466b"/><circle cx="37.5" cy="52.5" r="1.4" fill="#fff"/><circle cx="65.5" cy="52.5" r="1.4" fill="#fff"/><ellipse cx="27" cy="64" rx="6" ry="3.5" fill="${c2}" opacity=".8"/><ellipse cx="73" cy="64" rx="6" ry="3.5" fill="${c2}" opacity=".8"/><ellipse cx="50" cy="62" rx="3.5" ry="2.5" fill="#35466b"/><path d="M44 69q6 6 12 0" stroke="#35466b" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`}
const bg=(c,c2,x,y,k)=>`<g transform="translate(${x},${y}) scale(${k})">${bear(c,c2).replace(/<svg[^>]*>|<\/svg>/g,'')}</g>`,BA=(x,y,k)=>bg('#9cc3f5','#f6a9c8',x,y,k),BY=(x,y,k)=>bg('#f8b6d1','#f58fb8',x,y,k);
const hat=()=>{try{return JSON.parse(ls.get('olu_hat')||'{}')}catch(e){return{}}};
const duo=(s=110)=>{const h=hat(),f=`font-size:${s*.3}px`;return `<span class="float" style="position:relative;display:inline-block"><span class="hat" style="${f}">${h.Amell||''}</span>${bear('#9cc3f5','#f6a9c8',s)}</span><span class="float" style="animation-delay:.6s;position:relative;display:inline-block"><span class="hat" style="${f}">${h.Yakii||''}</span>${bear('#f8b6d1','#f58fb8',s)}</span>`};

/* ---- data layer: db bersama, cadangan lokal ---- */
function col(n){
 const key='olu_'+n;let subs=[];
 const local=()=>{try{return JSON.parse(ls.get(key)||'[]')}catch(e){return[]}};
 const push=a=>{ls.set(key,JSON.stringify(a));subs.forEach(f=>f(a))};
 if(dbm){const c=dbm.collection(n);
  return{sub(f){c.orderBy('ts').onSnapshot(s=>f(s.docs.map(d=>({id:d.id,...d.data()}))),e=>toast('Gagal memuat: '+e.code))},
   add:o=>c.add(o).catch(werr),set:(id,o)=>c.doc(id).set(o).catch(werr),del:id=>c.doc(id).delete().catch(werr)}}
 return{sub(f){subs.push(f);f(local())},add(o){const a=local();a.push({id:'l'+Date.now()+Math.random(),...o});push(a);return Promise.resolve()},
  set(id,o){const a=local();push(a.some(x=>x.id===id)?a.map(x=>x.id===id?{id,...o}:x):[...a,{id,...o}]);return Promise.resolve()},del(id){push(local().filter(x=>x.id!==id));return Promise.resolve()}}}
const werr=e=>toast(e&&e.code==='invalid_argument'?'Kamu belum boleh menyimpan. Minta pemilik link mengatur aksesmu sebagai Contributor 💙':'Gagal menyimpan, coba lagi ya');
const C={};
const strip=o=>{const{id,...r}=o;return r};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function hearts(e='💗'){for(let i=0;i<8;i++){const h=document.createElement('div');h.className='hrt';h.textContent=e;h.style.left=(15+Math.random()*70)+'%';h.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),2800)}}
function sheet(html){$('#sheetIn').innerHTML=html;$('#sheet').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}
$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};

/* ---- fitur interaksi ---- */
const PINGS={kangen:['😭','kangen kamu banget!'],peluk:['🫂','kirim peluk virtual'],cium:['😘','kirim cium jauh'],semangat:['💪','nyemangatin kamu hari ini!'],lapar:['🍜','laper, ayo makan bareng!'],sedih:['🥺','lagi butuh ditemenin']};
function ping(k){const[e,t]=PINGS[k];C.chat.add({from:who,text:`${e} ${who} ${t}`,kind:'ping',ts:Date.now()});hearts(e);toast(`${e} Terkirim ke ${other()}`)}
const JAR=['Kamu itu rumahku, tempat paling nyaman buat pulang 🏠','Hari buruk pun jadi lebih ringan kalau ada kamu 💙','Makasih sudah sabar sama aku ya 🩷','Aku bangga banget sama kamu hari ini ✨','Jangan lupa makan & minum, aku sayang kamu 🥤','Kita beda bintang, tapi satu semesta 🌌'];
function jar(){toast(JAR[Math.floor(Math.random()*JAR.length)]);hearts('💌')}
function gacha(){const l=D.wish.filter(w=>!w.done);if(!l.length)return toast('Wishlist kosong, tambah dulu yuk! 🎁');const w=l[Math.floor(Math.random()*l.length)];toast('🎲 Date berikutnya: '+w.text)}
function mood(m){C.chat.add({from:who,text:`Mood ${who} hari ini: ${m}`,kind:'ping',ts:Date.now()});toast(`${other()} jadi tahu moodmu ${m}`)}
function days(){return Math.floor((new Date().setHours(0,0,0,0)-START)/864e5)}
function nextMonthsary(){const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),26);if(d<new Date(n.setHours(0,0,0,0)))d=new Date(d.getFullYear(),d.getMonth()+1,26);return Math.round((d-new Date().setHours(0,0,0,0))/864e5)}

/* ---- halaman ---- */
const R={
home(){const u=D.chat.filter(m=>m.kind==='ping'&&m.from!==who).slice(-1)[0];return `
${partyBanner()}<div class="card"><div class="muted">Hari bersama · sejak 26 November 2024 💙</div><div class="row" style="justify-content:space-between"><div><div class="big">${days()}</div><div class="f">hari · ${Math.floor(days()/30)} bulan</div><div class="muted">Monthsary berikutnya ${nextMonthsary()} hari lagi 🎀</div></div><div>${duo(70)}</div></div></div>
${u?`<div class="card">${esc(u.text)}<div class="muted">${hm(u.ts)}</div></div>`:''}
<div class="card"><h3 style="margin:0 0 8px">Lagi kangen? Pencet aja 💌</h3><div class="grid2" style="grid-template-columns:repeat(3,1fr)">${Object.entries(PINGS).map(([k,[e,t]])=>`<button class="tile ${'ck'.includes(k[0])?'pk':''}" onclick="ping('${k}')"><span>${e}</span>${k}</button>`).join('')}</div></div>
<div class="card" style="text-align:center"><h3 style="margin:0 0 4px">Panggil Sayang 📞</h3><p class="muted" style="margin:0 0 8px">HP ${other()} akan berdering lucu, lalu lanjut telepon lewat WhatsApp</p><button class="btn pk" onclick="callStart()">Telepon ${other()} 💗</button><p style="margin:8px 0 0"><span class="chip" onclick="callSetup()">Atur nomor WA ${other()}</span></p></div>
<div class="card"><h3 style="margin:0 0 8px">Mood hari ini</h3><div class="row" style="justify-content:space-between">${['😊','🥰','😴','😤','😢'].map(m=>`<button class="tile" style="font-size:24px;padding:8px 12px" onclick="mood('${m}')">${m}</button>`).join('')}</div></div>
<div class="grid2"><button class="tile" onclick="jar()"><span>🫙</span>Love Jar</button><button class="tile pk" onclick="gacha()"><span>🎲</span>Gacha Date</button><button class="tile" onclick="go('foto')"><span>📷</span>Foto Kenangan</button><button class="tile pk" onclick="go('surat')"><span>💌</span>Surat & Maaf</button><button class="tile pk" onclick="go('nonton')"><span>🍿</span>Tontonan</button><button class="tile" onclick="go('kupon')"><span>🎟️</span>Kupon Cinta</button><button class="tile pk" onclick="go('game')"><span>🎮</span>Game Berdua</button><button class="tile" onclick="go('tanya')"><span>❓</span>Tanya Harian</button></div>`},
foto(){const p=[...D.photos].sort((a,b)=>b.taken-a.taken);return `<button class="btn" style="margin-bottom:12px" onclick="addPhoto()">＋ Tambah Foto</button>${p.length?`<div class="photos">${p.map(x=>`<div class="ph" onclick="viewPhoto('${x.id}')"><img src="${x.img}" alt=""><div><b>${esc(x.cap||'Kenangan')}</b>🕒 ${fmt(x.taken)}<br>oleh ${esc(x.by)}</div></div>`).join('')}</div>`:`<div class="empty">${duo(80)}<p>Belum ada foto. Yuk simpan momen pertama kita 📸</p></div>`}`},
surat(){const t=sub||'untuk';const l=D.letters.filter(x=>t==='untuk'?x.from!==who:x.from===who).sort((a,b)=>b.ts-a.ts);return `
<div class="card" style="text-align:center"><div class="float" style="font-size:44px">💌</div><h3 style="margin:4px 0">The Sorry Room</h3><p class="muted">Kalau lagi berantem, di sini tempat bicara dengan lebih tenang. Setiap kata itu berarti ♡</p>
<button class="btn" style="margin-bottom:8px" onclick="compose('maaf')">Aku mau minta maaf 🙏</button><button class="btn pk" onclick="compose('cinta')">Aku ingin menyampaikan perasaan 💗</button>
<p class="muted">Ingat ya, kamu tidak harus langsung memaafkan. Ambil waktu yang kamu butuhkan.</p></div>
<div class="tabs"><button class="${t==='untuk'?'on':''}" onclick="sub='untuk';draw()">Surat untuk kamu</button><button class="${t==='dari'?'on':''}" onclick="sub='dari';draw()">Surat dari kamu</button></div>
${l.length?l.map(x=>`<div class="card" onclick="openLetter('${x.id}')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b class="f">${x.kind==='maaf'?'🙏 Permintaan Maaf':'💗 Surat Cinta'}</b>${x.read?'<span class="muted">dibaca ✓</span>':'<span class="chip">baru</span>'}</div><div class="muted">${x.from} · ${fmt(x.ts)}</div>${x.reply?`<div class="muted">Balasan: ${esc(x.reply)}</div>`:''}</div>`).join(''):`<div class="empty">Belum ada surat 🕊️</div>`}`},
wish(){const t=sub||'todo';const l=D.wish.filter(w=>t==='todo'?!w.done:w.done);return `<div class="tabs"><button class="${t==='todo'?'on':''}" onclick="sub='todo';draw()">Daftar Keinginan</button><button class="${t==='done'?'on':''}" onclick="sub='done';draw()">Sudah Dilakukan</button></div>
<div class="card" style="padding:4px 14px">${l.length?l.map(w=>`<div class="item"><input type="checkbox" ${w.done?'checked':''} onchange="togWish('${w.id}')"><div style="flex:1" class="${w.done?'done':''}"><b class="f">${esc(w.text)}</b><div class="muted">${esc(w.note||'')} · ${esc(w.by)}</div></div><button class="chip" style="border:0" onclick="C.wish.del('${w.id}')">🗑️</button></div>`).join(''):'<div class="empty">Kosong dulu 🌱</div>'}</div><button class="btn" onclick="addWish()">＋ Tambah Wishlist</button>`},
chat(){return `<div class="msgs">${D.chat.map(m=>m.kind==='ping'?`<div class="ping">${esc(m.text)} · ${hm(m.ts)}</div>`:`<div class="b ${m.from===who?'me':'you'}">${esc(m.text)}<small>${m.from===who?'':esc(m.from)+' · '}${hm(m.ts)}</small></div>`).join('')||`<div class="empty">${duo(80)}<p>Mulai obrolan berdua 💬</p></div>`}</div>`},
musik(){return `<div class="card" style="text-align:center"><div class="float" style="font-size:60px">🌙</div><h3 style="margin:0">Music Box Kita</h3><p class="muted">Dentingan lembut buat nemenin malam</p><button class="btn" id="mb" onclick="musicBox()">▶ Putar Music Box</button></div>
<h3 style="margin:8px 4px">Playlist Kita 🎵</h3><div class="card" style="padding:4px 14px">${D.songs.length?D.songs.map(s=>`<div class="item"><span style="font-size:24px">🎵</span><a style="flex:1;color:inherit;text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.title+' '+s.artist)}"><b class="f">${esc(s.title)}</b><div class="muted">${esc(s.artist)} · dibuka di YouTube</div></a><button class="chip" style="border:0" onclick="C.songs.del('${s.id}')">🗑️</button></div>`).join(''):'<div class="empty">Tambah lagu favorit kalian 🎧</div>'}</div><button class="btn pk" onclick="addSong()">＋ Tambah Lagu</button>`}
};
const dd=t=>new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const tw=n=>Array.from({length:n},(_,i)=>`<circle class="tw" cx="${(i*47+20)%290}" cy="${(i*31+12)%80}" r="1.6" fill="#fff" style="animation-delay:${i*.3}s"/>`).join('');
const rain=Array.from({length:16},(_,i)=>`<line class="rn" x1="${i*19+5}" y1="${(i*23)%60}" x2="${i*19+2}" y2="${(i*23)%60+10}" stroke="#fff" stroke-width="1.5" style="animation-delay:${i*.1}s"/>`).join('');

 $('#nav').innerHTML=NAV.map(([k,i,n])=>`<button class="${k===page||(k==='lain'&&SUB.includes(page))?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');

 if(page==='chat'&&bottom)m.scrollTop=m.scrollHeight;else m.scrollTop=st}

function addPhoto(){sheet(`<h3>Foto Kenangan 📷</h3><label>Pilih foto</label><input type="file" id="pf" accept="image/*"><label>Judul / cerita singkat</label><input id="pc" placeholder="Nonton bareng di bioskop"><label>Kapan foto ini diambil?</label><input type="datetime-local" id="pt" value="${new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}"><p></p><button class="btn" onclick="savePhoto()">Simpan</button>`)}
function savePhoto(){const f=$('#pf').files[0];if(!f)return toast('Pilih fotonya dulu ya');const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const d=c.toDataURL('image/jpeg',.6);if(d.length>240000)return toast('Fotonya terlalu besar, coba foto lain');C.photos.add({img:d,cap:$('#pc').value,taken:new Date($('#pt').value).getTime()||Date.now(),by:who,ts:Date.now()}).then(()=>{closeSheet();toast('Tersimpan 📸')})};im.src=u}

function sendLetter(k){const b=$('#lb').value.trim();if(!b)return toast('Tulis dulu isinya ya');C.letters.add({from:who,kind:k,body:b,read:false,reply:'',ts:Date.now()}).then(()=>{closeSheet();toast('Surat terkirim 💌');hearts()})}
function openLetter(id){const x=D.letters.find(l=>l.id===id);if(!x)return;const mine=x.from===who;if(!mine&&!x.read)C.letters.set(id,{...strip(x),read:true});
 sheet(`<div class="muted">${x.from} · ${fmt(x.ts)}</div><h3>${x.kind==='maaf'?'Surat Permintaan Maaf':'Surat Cinta'}</h3><div class="letter">${esc(x.body)}</div>${x.reply?`<p class="muted">Balasan: <b>${esc(x.reply)}</b></p>`:''}${mine?'':`<div class="muted" style="margin-top:10px">Balas surat ini</div><div class="rp">${['Aku sudah baca 💗','Aku masih butuh waktu ⏳','Ayo ngobrol baik-baik 🫶','Aku maafin kamu 🥹'].map(r=>`<button onclick="reply('${id}','${r}')">${r}</button>`).join('')}</div>`}`)}
function reply(id,r){const x=D.letters.find(l=>l.id===id);C.letters.set(id,{...strip(x),read:true,reply:r}).then(()=>{closeSheet();toast('Balasan terkirim')})}

let ac,playing=false,tm;
function musicBox(){const b=$('#mb');if(playing){playing=false;clearTimeout(tm);b.textContent='▶ Putar Music Box';return}
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return toast('Browser tidak mendukung audio')}
 const notes=[523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,587],i0={i:0};playing=true;b.textContent='⏸ Hentikan';
 (function step(){if(!playing)return;const f=notes[i0.i++%notes.length],o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.1);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1.1);tm=setTimeout(step,520)})()}
